[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent-runtime"
version = "0.1.0"
description = "Validated, transactional PostgreSQL state transitions from user intent"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "psycopg[binary]>=3.2,<4", "PyYAML>=6,<7", "fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
superagent = "superagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".deps", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
superagent = ["templates/*.yaml"]
