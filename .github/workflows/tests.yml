name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: superagent_test
          POSTGRES_DB: superagent_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d superagent_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:superagent_test@localhost:5432/superagent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q
      - run: pip wheel . --no-deps -w dist
      - run: superagent --help
